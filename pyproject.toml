[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-policy-engine"
version = "0.1.0"
description = "Risk-tiered autonomy and runtime policy enforcement for AI agents"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
policy-engine = "cli.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]